# DNS Docker. Контейнер после пересоздания получает новый IP —
# nginx перечитывает адреса воркеров каждые 5 секунд.
resolver 127.0.0.11 valid=5s ipv6=off;

# Группа серверов-воркеров
upstream app_backend {
    # Общая память для всех процессов nginx: единые счётчики соединений
    # и ошибок (без неё у каждого процесса своя очередь) + нужна для resolve
    zone app_backend 64k;
    least_conn;    # новый запрос — тому, кто меньше занят
    # После 3 ошибок сервер исключается на 10 секунд;
    # resolve — следить за сменой IP контейнера
    server app1:8000 max_fails=3 fail_timeout=10s resolve;
    server app2:8000 max_fails=3 fail_timeout=10s resolve;
    server app3:8000 max_fails=3 fail_timeout=10s resolve;
    # Держим соединения к воркерам открытыми
    keepalive 32;
}

server {
    listen 80;

    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    # Метрики воркеров читает только Prometheus напрямую (app1:8000/metrics)
    location = /metrics {
        return 404;
    }

    location / {
        proxy_pass http://app_backend;
        proxy_http_version 1.1;          # нужно для keepalive
        proxy_set_header Connection "";

        # Передаём воркеру данные о реальном клиенте
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

        # Воркер упал — повторить запрос на другом
        # (POST не повторяется: иначе можно создать заказ дважды)
        proxy_next_upstream error timeout http_502 http_503;
        proxy_connect_timeout 2s;
        proxy_read_timeout 30s;

        # Для наглядности: адрес воркера, обработавшего запрос
        add_header X-Upstream $upstream_addr always;
    }
}
