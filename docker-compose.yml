name: shop

# Общий шаблон воркера (якорь &app). Блоки x-... Docker игнорирует.
x-app: &app
  build: ./app
  environment: &app-env
    # ВНИМАНИЕ: хост базы — postgres (имя сервиса), а не localhost
    # Все соединения с БД — через PgBouncer (порт 6432); shop_r1/shop_r2 — реплики
    DATABASE_URL: postgresql://shop:shop@pgbouncer:6432/shop
    # Адреса для первого подключения; остальную карту кластера клиент узнает сам
    REDIS_CLUSTER_NODES: redis1:6379,redis2:6379,redis3:6379,redis4:6379,redis5:6379,redis6:6379
    RABBITMQ_URL: amqp://shop:shop@rabbitmq:5672/
    # Чтение каталога — с реплик (по очереди)
    DATABASE_REPLICA_URLS: postgresql://shop:shop@pgbouncer:6432/shop_r1,postgresql://shop:shop@pgbouncer:6432/shop_r2
  depends_on:
    postgres:
      condition: service_healthy   # стартовать, когда база готова
    redis-init:
      condition: service_completed_successfully   # кластер собран
    rabbitmq:
      condition: service_healthy
    pgbouncer:
      condition: service_started
    db-migrate:
      condition: service_completed_successfully   # индексы созданы
  mem_limit: 200m
  cpus: 0.5                        # имитируем слабый сервер — пол-ядра
  restart: on-failure

# Общий шаблон реплики PostgreSQL
x-replica: &replica
  image: postgres:16-alpine
  entrypoint: ["sh", "/replica-entrypoint.sh"]
  command: ["-c", "config_file=/etc/postgresql/postgresql.conf"]
  environment:
    PRIMARY_HOST: postgres
    POSTGRES_USER: shop
    POSTGRES_DB: shop
    REPLICATION_PASSWORD: replicator
  depends_on:
    postgres:
      condition: service_healthy
  shm_size: 256m
  mem_limit: 384m
  healthcheck:
    test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
    interval: 5s
    timeout: 3s
    retries: 30
    start_period: 30s

# Общий шаблон узла Redis Cluster
x-redis: &redis
  image: redis:7.4-alpine
  volumes:
    - ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
  mem_limit: 96m
  healthcheck:
    test: ["CMD", "redis-cli", "ping"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # Primary: принимает запись и отдаёт поток WAL репликам
  postgres:
    image: postgres:16-alpine
    # Свой файл настроек (лаб 7): память, SSD, репликация, pg_stat_statements
    command: ["postgres", "-c", "config_file=/etc/postgresql/postgresql.conf"]
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
      REPLICATION_PASSWORD: replicator    # для db/init/02_replication.sh
    ports:
      - "5432:5432"          # чтобы приложение на компьютере могло подключиться
    volumes:
      - pgdata:/var/lib/postgresql/data              # данные БД переживут перезапуск
      - ./db/init:/docker-entrypoint-initdb.d:ro     # схема и тестовые данные
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro                             # индексы и диагностика
    shm_size: 256m
    mem_limit: 512m
    healthcheck:
      # база готова, когда отвечает по TCP (после загрузки данных)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Реплики: копия primary только для чтения
  postgres-r1:
    <<: *replica
    volumes:
      - pgdata_r1:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro
  postgres-r2:
    <<: *replica
    volumes:
      - pgdata_r2:/var/lib/postgresql/data
      - ./db/replica-entrypoint.sh:/replica-entrypoint.sh:ro
      - ./db/conf/postgresql.conf:/etc/postgresql/postgresql.conf:ro
      - ./db/sql:/sql:ro

  # Одноразовый контейнер: создаёт индексы (db/sql/indexes.sql) и завершается
  db-migrate:
    image: postgres:16-alpine
    command: ["psql", "-h", "postgres", "-U", "shop", "-d", "shop",
              "-v", "ON_ERROR_STOP=1", "-f", "/sql/indexes.sql"]
    environment:
      PGPASSWORD: shop
    volumes:
      - ./db/sql:/sql:ro
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # Пул соединений перед primary и репликами
  pgbouncer:
    image: edoburu/pgbouncer:v1.26.1-p0
    volumes:
      - ./pgbouncer/pgbouncer.ini:/etc/pgbouncer/pgbouncer.ini:ro
      - ./pgbouncer/userlist.txt:/etc/pgbouncer/userlist.txt:ro
    ports:
      - "6432:6432"          # консоль: psql -h localhost -p 6432 -U shop pgbouncer
    depends_on:
      postgres:
        condition: service_healthy
      postgres-r1:
        condition: service_started
      postgres-r2:
        condition: service_started
    mem_limit: 64m

  # Redis Cluster: 6 узлов (3 мастера + 3 реплики). Наружу порты не открываем.
  redis1:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis1"]
  redis2:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis2"]
  redis3:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis3"]
  redis4:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis4"]
  redis5:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis5"]
  redis6:
    <<: *redis
    command: ["redis-server", "/usr/local/etc/redis/redis.conf", "--cluster-announce-hostname", "redis6"]

  # Одноразовый контейнер: собирает кластер и завершается
  redis-init:
    image: redis:7.4-alpine
    volumes:
      - ./redis/cluster-init.sh:/cluster-init.sh:ro
    command: ["sh", "/cluster-init.sh"]
    depends_on:
      redis1: { condition: service_healthy }
      redis2: { condition: service_healthy }
      redis3: { condition: service_healthy }
      redis4: { condition: service_healthy }
      redis5: { condition: service_healthy }
      redis6: { condition: service_healthy }
    restart: "no"

  # Три одинаковых воркера. Порт наружу не открываем — доступ только через lb.
  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  # Брокер сообщений. Веб-интерфейс: http://localhost:15672 (shop / shop)
  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    hostname: rabbitmq         # имя узла RabbitMQ: данные в томе привязаны к нему
    environment:
      RABBITMQ_DEFAULT_USER: shop
      RABBITMQ_DEFAULT_PASS: shop
      # Планировщики Erlang по умолчанию крутятся в холостом цикле (busy wait)
      # и съедают CPU даже без нагрузки. В контейнере это только мешает соседям.
      RABBITMQ_SERVER_ADDITIONAL_ERL_ARGS: "+sbwt none +sbwtdcpu none +sbwtdio none"
    volumes:
      - rabbitdata:/var/lib/rabbitmq                       # очереди переживут перезапуск
      - ./rabbitmq/limits.conf:/etc/rabbitmq/conf.d/20-limits.conf:ro
    ports:
      - "15672:15672"          # веб-интерфейс
    mem_limit: 384m
    healthcheck:
      # Готов, когда открыт порт AMQP. rabbitmq-diagnostics не используем:
      # он при каждом вызове запускает целую виртуальную машину Erlang
      # и даёт всплеск CPU до 150% каждые 10 секунд
      test: ["CMD-SHELL", "nc -z 127.0.0.1 5672"]
      interval: 10s
      timeout: 10s
      retries: 12
      start_period: 20s

  # Обработчик очереди заказов: тот же образ, другая команда
  consumer:
    <<: *app
    command: ["python", "consumer.py"]
    environment: { <<: *app-env, INSTANCE_NAME: consumer, PAYMENT_DELAY_SEC: "0.2" }
    mem_limit: 128m

  # Балансировщик нагрузки
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [app1, app2, app3]
    mem_limit: 64m

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    environment:
      BASE_URL: http://lb     # изнутри сети Docker — по имени сервиса
    volumes:
      - ./k6:/scripts:ro

volumes:
  pgdata:
  pgdata_r1:
  pgdata_r2:
  rabbitdata:
