name: shop

# Общий шаблон воркера (якорь &app). Блоки x-... Docker игнорирует.
x-app: &app
  build: ./app
  environment: &app-env
    # ВНИМАНИЕ: хост базы — postgres (имя сервиса), а не localhost
    DATABASE_URL: postgresql://shop:shop@postgres:5432/shop
    REDIS_URL: redis://redis:6379/0
  depends_on:
    postgres:
      condition: service_healthy   # стартовать, когда база готова
    redis:
      condition: service_healthy
  mem_limit: 200m
  cpus: 0.5                        # имитируем слабый сервер — пол-ядра
  restart: on-failure

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_PASSWORD: shop
      POSTGRES_DB: shop
    ports:
      - "5432:5432"          # чтобы приложение на компьютере могло подключиться
    volumes:
      - pgdata:/var/lib/postgresql/data              # данные БД переживут перезапуск
      - ./db/init:/docker-entrypoint-initdb.d:ro     # схема и тестовые данные
    shm_size: 256m
    mem_limit: 512m
    healthcheck:
      # база готова, когда отвечает по TCP (после загрузки данных)
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U shop -d shop"]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 30s

  # Кэш. Только в памяти (без сохранения на диск): кэш можно потерять.
  # maxmemory + allkeys-lru: при нехватке памяти вытесняются давно не читанные ключи.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--save", "", "--appendonly", "no",
              "--maxmemory", "64mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"          # для запуска приложения на компьютере и redis-cli
    mem_limit: 128m
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  # Три одинаковых воркера. Порт наружу не открываем — доступ только через lb.
  app1:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app1 }

  app2:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app2 }

  app3:
    <<: *app
    environment: { <<: *app-env, INSTANCE_NAME: app3 }

  # Балансировщик нагрузки
  lb:
    image: nginx:1.27-alpine
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "8080:80"
    depends_on: [app1, app2, app3]
    mem_limit: 64m

  k6:
    image: grafana/k6:latest
    profiles: ["test"]
    environment:
      BASE_URL: http://lb     # изнутри сети Docker — по имени сервиса
    volumes:
      - ./k6:/scripts:ro

volumes:
  pgdata:
